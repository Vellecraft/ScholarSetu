services:
  - type: web
    name: scholarsetu
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /api/health
    disk:
      name: scholarsetu-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_TOKEN
        generateValue: true
